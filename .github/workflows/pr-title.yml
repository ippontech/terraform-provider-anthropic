name: PR Title

# Pull requests are squash-merged and the commit takes the PR title, which
# semantic-release then reads to choose the next version and write the release
# notes (.releaserc). A title it cannot parse silently produces no release.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # The check makes no network call.
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: ''

      # In the merge queue the title was already checked on the pull request;
      # the job still runs so that a required check reports there too.
      - name: Check the PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          # The breaking-change guards below apply to pull requests to main,
          # except the major/<version> release PR of this repository (RELEASE.md,
          # "Cutting the release"): it is merged with a merge commit, so neither
          # its title nor its description becomes a commit semantic-release
          # parses; the commits it brings carry the breaking changes.
          guard_breaking=false
          if [[ "${BASE_REF}" == "main" && ! ( "${HEAD_REPO}" == "${REPO}" && "${HEAD_REF}" == major/* ) ]]; then
            guard_breaking=true
          fi
          # The types semantic-release acts on or knows (.releaserc and the
          # commit-analyzer default rules, table in CONTRIBUTING.md). `feature`,
          # an alias in the conventionalcommits preset, is left out: no release
          # rule matches it, so it would silently publish nothing.
          types='feat|fix|perf|revert|docs|style|chore|refactor|test|build|ci'
          pattern="^(${types})(\([^()]+\))?(!)?: [^[:space:]]"
          if [[ "${TITLE}" =~ ^Revert\ \".+\"$ ]]; then
            # GitHub's revert button titles the PR 'Revert "<original title>"',
            # which semantic-release reads as a revert.
            echo "PR title is a GitHub revert."
          elif [[ ! "${TITLE}" =~ ${pattern} ]]; then
            echo "::error title=PR title::Expected '<type>[(scope)][!]: <subject>' with type one of ${types//|/, } (Conventional Commits, see CONTRIBUTING.md)."
            exit 1
          elif [[ -n "${BASH_REMATCH[3]}" && "${guard_breaking}" == true ]]; then
            # feat! / fix! on main would publish a major release. Breaking
            # changes go to the major/<version> staging branch (RELEASE.md).
            echo "::error title=PR title::'!' marks a breaking change, which must target the major/<version> staging branch, not main (see RELEASE.md, section Major versions)."
            exit 1
          fi
          # The PR description becomes the squash commit body, where a
          # BREAKING CHANGE footer would publish a major release just the same.
          # The pattern is the notes rule of conventional-commits-parser, which
          # semantic-release applies to every line of the body:
          # ^[\s|*]*(BREAKING CHANGE|BREAKING-CHANGE)[:\s]+, case-insensitive.
          if [[ "${guard_breaking}" == true ]] && grep -qiE '^[[:space:]|*]*BREAKING[ -]CHANGE[:[:space:]]' <<< "${BODY}"; then
            echo "::error title=PR description::A line starting with 'BREAKING CHANGE' or 'BREAKING-CHANGE' (any case, after spaces or '*', followed by ':' or a space) marks a breaking change, which must target the major/<version> staging branch, not main (see RELEASE.md, section Major versions)."
            exit 1
          fi
          echo "PR title follows Conventional Commits."
