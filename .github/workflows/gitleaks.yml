name: Gitleaks

# Secret scanning with the gitleaks CLI and .gitleaks.toml (the default rules
# plus Claude Enterprise scoped keys). On a pull request and in the merge
# queue it scans the commits the change brings; weekly and on demand, the
# whole history of every branch, since a rule added or improved later can
# find a secret committed long ago. gitleaks/gitleaks-action is not used: it
# needs a paid licence for an organization's repositories.
on:
  pull_request:
  merge_group:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443

      # The whole history: the base commit of a pull request must exist, and
      # the full scan reads every branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Same method as tflint and poutine in security.yml: the expected hash is
      # pinned here, not read from the release's checksums file. Bump
      # GITLEAKS_VERSION and GITLEAKS_SHA256 together (value from the target
      # release's gitleaks_<version>_checksums.txt, linux_x64 line), and keep
      # the version in step with mise.toml. Renovate only bumps the version, so
      # its PR fails here until the hash is updated by hand; renovate.json
      # excludes gitleaks from automerge and bumps mise.toml in the same PR.
      - name: Install gitleaks
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION: v8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_linux_x64.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          install_dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "${install_dir}"
          tar xzf "${archive}" -C "${install_dir}" gitleaks
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/gitleaks" version

      # BASE_SHA is the base branch's commit of the pull request or of the
      # merge queue entry, empty on a schedule or a manual run: then every
      # commit of every branch is scanned. Secrets are redacted from the log
      # and the report; the job fails on any finding.
      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          args=(git --config .gitleaks.toml --redact --no-banner --verbose
            --report-format json --report-path "${RUNNER_TEMP}/gitleaks.json")
          if [ -n "${BASE_SHA}" ]; then
            args+=(--log-opts "${BASE_SHA}..HEAD")
          fi
          gitleaks "${args[@]}"

      # One row per finding (rule, file, line, commit), without the secret.
      - name: Summary
        if: ${{ failure() }}
        run: |
          if [ -s "${RUNNER_TEMP}/gitleaks.json" ]; then
            {
              echo "## gitleaks findings"
              echo
              echo "Add \`gitleaks:allow\` at the end of the line only for a deliberate fake (a test fixture), and in the commit that adds the line: every commit of the pull request is scanned, so a later commit adding the comment does not clear the finding (amend or rebase, then force-push). A real secret must be revoked, then removed from the history."
              echo
              echo "| Rule | File | Line | Commit |"
              echo "|---|---|---:|---|"
              jq -r '.[] | "| \(.RuleID) | `\(.File)` | \(.StartLine) | \(.Commit[0:12]) |"' "${RUNNER_TEMP}/gitleaks.json"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
