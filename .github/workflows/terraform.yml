name: Terraform

# Terraform-level checks that need neither credentials nor the Anthropic API,
# so they can run on every pull request, forks included. The live native tests
# (make terraform-test) still run only after merge, in testacc.yml.
on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  terraform-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # No version check call to checkpoint-api.hashicorp.com.
      CHECKPOINT_DISABLE: '1'
    steps:
      # No registry.terraform.io and no api.anthropic.com: the provider comes
      # from dev_overrides, and the native tests run here mock it.
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            releases.hashicorp.com:443
            storage.googleapis.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      # The Terraform version of mise.toml, which Renovate bumps in a reviewed
      # pull request: without terraform_version the action installs the latest
      # release, and a new one could turn this check red on every pull request
      # with no change in the repository.
      - name: Read the Terraform version pinned in mise.toml
        id: terraform-version
        run: |
          version=$(sed -n 's/^terraform = "\(.*\)"$/\1/p' mise.toml)
          [ -n "${version}" ] || { echo "::error file=mise.toml::no terraform version found"; exit 1; }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: make terraform-fmt-check

      # Builds and installs the provider, then validates the example
      # directories against it.
      - name: Validate the examples
        run: make terraform-validate

      # The test files with a mock_provider block: plan and apply
      # against the mocked provider, no credentials.
      - name: Run the offline native tests
        run: make terraform-test-mock
