name: Provider

on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Check formatting
        run: |
          make fmt
          git diff --exit-code || (echo "Run 'make fmt' and commit the result." && exit 1)

      - name: Check go.mod tidiness
        run: make tidy-check

      # Fails if a module in the module cache changed after it was downloaded.
      - name: Verify module checksums
        run: go mod verify

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            checkpoint-api.hashicorp.com:443
            github.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            releases.hashicorp.com:443
            storage.googleapis.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # resource.UnitTest runs the Terraform CLI against an httptest fake of
      # the API. The wrapper would interfere with terraform-exec's output.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Build
        run: make build

      - name: Run unit tests
        run: make test COVERPROFILE=coverage.out

      # The coverage job below enforces the gate on this profile.
      - name: Upload coverage profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

      # The coverage summary's own tests: tools/ is a separate module, which
      # the root `go test ./...` above does not reach.
      - name: Test the coverage summary
        run: go test -C tools ./coversummary

  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            checkpoint-api.hashicorp.com:443
            github.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            releases.hashicorp.com:443
            storage.googleapis.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Run generate
        run: make generate

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code || (echo "Running 'make generate' produced changes. Please run it locally and commit the result." && exit 1)

  # The coverage gate (.coverage.json, tools/coversummary): at least 75% of the
  # statements a pull request changes are covered, the total stays at or above
  # .coverage-baseline minus the tolerance, and never under 75% once the
  # baseline reaches it. A required check: it fails, it does not warn.
  coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443

      # The whole history, so that the base commit and the merge base exist.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage

      # BASE_SHA is the base branch's commit of the pull request, or of the
      # merge queue entry. The diff rule reads the lines the change adds or
      # modifies; the floor rule reads the base branch's baseline, absent
      # until this gate lands.
      - name: Coverage gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          git diff --unified=0 --no-color "${BASE_SHA}...HEAD" > "${RUNNER_TEMP}/changes.diff"
          git show "${BASE_SHA}:.coverage-baseline" > "${RUNNER_TEMP}/base-baseline" 2> /dev/null || rm -f "${RUNNER_TEMP}/base-baseline"
          go run -C tools ./coversummary -config ../.coverage.json \
            -diff "${RUNNER_TEMP}/changes.diff" -base-baseline "${RUNNER_TEMP}/base-baseline" \
            ../coverage.out >> "${GITHUB_STEP_SUMMARY}"
