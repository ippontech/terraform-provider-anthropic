name: Acceptance Tests

on:
  # Called by semantic-release.yml on every push to main, which releases only when these jobs pass
  # (RELEASE.md, "How a release is cut"). The caller must pass each secret by name, even one that
  # exists only in the acctest environment of the jobs below, which then receive that environment's
  # value (GitHub docs, "Reuse workflows"). Not `required`: that only checks that the caller passes
  # the secret, not its value (same page), and a missing key already fails the tests
  # (acctest.PreCheck stops on an empty key).
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      ANTHROPIC_ADMIN_API_KEY:
        required: false
      ANTHROPIC_MULTI_WORKSPACE_API_KEY:
        required: false
  workflow_dispatch:

permissions: {}

jobs:
  testacc:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    environment: acctest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.anthropic.com:443
            api.github.com:443
            checkpoint-api.hashicorp.com:443
            github.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            releases.hashicorp.com:443
            storage.googleapis.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # Pinned instead of the action's default, `latest`: the CLI runs next to the keys. Renovate's
          # github-actions manager tracks this input, in the reviewed `release tooling` group
          # (.github/renovate.md, "Release tooling").
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Run acceptance tests
        run: make testacc
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_ADMIN_API_KEY: ${{ secrets.ANTHROPIC_ADMIN_API_KEY }}
          ANTHROPIC_MULTI_WORKSPACE_API_KEY: ${{ secrets.ANTHROPIC_MULTI_WORKSPACE_API_KEY }}

  terraform-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: acctest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.anthropic.com:443
            api.github.com:443
            checkpoint-api.hashicorp.com:443
            github.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            releases.hashicorp.com:443
            registry.terraform.io:443
            storage.googleapis.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # Pinned instead of the action's default, `latest`: the CLI runs next to the keys. Renovate's
          # github-actions manager tracks this input, in the reviewed `release tooling` group
          # (.github/renovate.md, "Release tooling").
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Run Terraform tests
        run: make terraform-test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_ADMIN_API_KEY: ${{ secrets.ANTHROPIC_ADMIN_API_KEY }}
