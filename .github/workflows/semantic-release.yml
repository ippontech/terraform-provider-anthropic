name: Semantic Release

# Cuts one release a day from the head of `main`, or on demand; the acceptance tests on every push
# live in testacc.yml (RELEASE.md, "How a release is cut"). Releasing on every push cut one version
# per merged pull request: on a day of Renovate merges, up to twenty, each a changelog entry, a
# signing run and a registry ingestion for nothing a user needed separately.
on:
  schedule:
    # 07:23 UTC: 08:23 in Paris in winter, 09:23 in summer (GitHub schedules take UTC only; an
    # off-the-hour minute, since GitHub drops scheduled runs under the load of the top of the
    # hour). The second one is a retry: it releases only if the day still has no release, after a
    # morning run that was dropped, cancelled while waiting behind a push run, or that found
    # `main` moved during its tests (semantic-release then publishes nothing, and exits green).
    - cron: '23 7 * * *'
    - cron: '23 12 * * *'
  workflow_dispatch:

permissions: {}

# Same group as testacc.yml, so a release waits for a push run still testing (and the reverse):
# two live test runs at once would collide in the test workspace.
concurrency:
  group: acceptance-tests-main
  cancel-in-progress: false

jobs:
  # Goes on only when a commit since the last tag would cut a version; otherwise the two-hour
  # live test run would create objects in the test workspace every morning for a release that
  # semantic-release would then decline to cut. The check mirrors .releaserc: the release types
  # listed there, a `!` after the type, or a `BREAKING CHANGE:` footer. Keep the two in step.
  pending:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the tags, and the commits since the newest one
          persist-credentials: false

      - name: Check whether a commit since the last release tag cuts a version
        id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          last=$(git tag --merged HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          range="${last:+${last}..}HEAD"
          release=false
          if git log --format=%s "${range}" | grep -Eq '^(feat|fix|perf|refactor|build|docs)(\([^)]*\))?!?:' \
            || git log --format=%s "${range}" | grep -Eq '^[a-z]+(\([^)]*\))?!:' \
            || git log --format=%B "${range}" | grep -q '^BREAKING CHANGE:'; then
            release=true
          fi
          # The retry run never cuts a second version in a day.
          if [ "${SCHEDULE}" = "23 12 * * *" ] && [ -n "${last}" ] \
            && [ "$(git log -1 --format=%cs "${last}")" = "$(date -u +%F)" ]; then
            release=false
          fi
          echo "release=${release}" >> "${GITHUB_OUTPUT}"
          echo "Release to cut since ${last:-the first commit}: ${release}." >> "${GITHUB_STEP_SUMMARY}"

  # Run again from the head of `main`, whatever the push runs found: the release waits for them,
  # and a red run publishes nothing.
  acceptance-tests:
    needs: pending
    if: needs.pending.outputs.release == 'true'
    uses: ./.github/workflows/testacc.yml
    permissions:
      contents: read
    # Passed by name, not with `secrets: inherit`: the values come from the acctest environment of
    # the called jobs, and nothing else reaches them.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_ADMIN_API_KEY: ${{ secrets.ANTHROPIC_ADMIN_API_KEY }}
      ANTHROPIC_MULTI_WORKSPACE_API_KEY: ${{ secrets.ANTHROPIC_MULTI_WORKSPACE_API_KEY }}

  # Releases every commit merged since the last tag as one version.
  release:
    needs: acceptance-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The App ID and private key are secrets of this environment only, whose deployment policy
    # admits `main` alone (RELEASE.md, "Protect the release credentials").
    environment: semantic-release
    # Every write (release commit, tag, GitHub release, issue and PR comments) goes through the
    # App token below, so the job token only needs to read the repository.
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            registry.npmjs.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # The whole tree, transitive packages included, comes from the committed lockfile with its
      # integrity hashes, and no package lifecycle script runs (also enforced by the .npmrc there).
      - name: Install semantic-release and plugins
        working-directory: .github/semantic-release
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Minted only now, after the install, and handed to the publishing step alone: no code that
      # runs while packages are installed can read it, and checkout did not persist it in git config.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SEMREL_APP_ID }}
          private-key: ${{ secrets.SEMREL_APP_PRIVATE_KEY }}
          # Only what semantic-release uses: the release commit, the tag and the GitHub release
          # (contents), the comments and labels on released issues and pull requests (issues,
          # pull-requests). Without these inputs the token inherits every permission of the App,
          # including any granted later for another purpose.
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      # semantic-release authenticates its own git push with GITHUB_TOKEN (x-access-token URL).
      - name: Run semantic-release
        run: ./.github/semantic-release/node_modules/.bin/semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
