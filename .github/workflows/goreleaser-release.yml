name: GoReleaser Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions: {}

jobs:
  # Runs before the signing job, with no secret (only the read-only job token): it writes on the
  # run's summary page the go.mod lines that changed since the last release users received signed,
  # as an audit trail of what each version shipped. A maintainer reviewed each module update at
  # its merge, the last human check before it ships signed (RELEASE.md, "Review the modules a
  # release ships"); nothing waits for anyone here.
  dependency-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the previous release tag and its go.mod
          persist-credentials: false

      # The baseline is the newest earlier tag whose GitHub release carries the signed checksums.
      # A version tagged but never signed (signing failed, release deleted) is
      # skipped, so its module changes are listed again here rather than shipping unseen. A failed
      # API call also counts as unsigned: it widens the comparison, never narrows it.
      - name: List the go.mod changes since the last signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(git tag --merged "${GITHUB_SHA}^" --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname)
          previous=""
          unsigned=()
          for tag in "${tags[@]:0:20}"; do
            assets=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.assets[].name' 2>/dev/null || true)
            if grep -q '_SHA256SUMS\.sig$' <<< "${assets}"; then
              previous="${tag}"
              break
            fi
            unsigned+=("${tag}")
          done
          if [ -z "${previous}" ]; then
            if [ "${#tags[@]}" -eq 0 ]; then
              echo "No previous release tag: nothing to compare." >> "${GITHUB_STEP_SUMMARY}"
            else
              echo "No release with signed binaries among the ${#unsigned[@]} most recent tags: compare \`go.mod\` by hand." >> "${GITHUB_STEP_SUMMARY}"
            fi
            exit 0
          fi
          changes=$(git diff --unified=0 "${previous}" "${GITHUB_SHA}" -- go.mod | grep -E '^[-+][^-+]' || true)
          {
            echo "## go.mod changes from ${previous} to ${GITHUB_REF_NAME}"
            echo
            if [ "${#unsigned[@]}" -gt 0 ]; then
              echo "${previous} is the last release with signed binaries. Tagged but never signed, so included here: ${unsigned[*]}."
              echo
            fi
            if [ -z "${changes}" ]; then
              echo "None: this release compiles the same modules as ${previous}."
            else
              echo "\`go.mod\` lists every module compiled into the provider. Each change was reviewed at its merge (RELEASE.md, \"Review the modules a release ships\")."
              echo
              echo '```diff'
              echo "${changes}"
              echo '```'
            fi
            echo
            echo "Full diff: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
          } >> "${GITHUB_STEP_SUMMARY}"

  goreleaser-release:
    needs: dependency-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The GPG key and its passphrase are secrets of this environment only, whose deployment
    # policy admits `v*` tags alone (RELEASE.md, "Protect the release credentials"); a workflow
    # pushed on any other ref cannot read them.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            uploads.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # GoReleaser needs the full git history to build the changelog and detect the previous tag
          persist-credentials: false  # GoReleaser publishes through GITHUB_TOKEN, not git

      # Defence in depth only: a tag-triggered run reads this file from the tagged commit, so the
      # tag ruleset and the environment above are what actually stop an arbitrary tag.
      - name: Check the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main; refusing to sign a release from it."
            exit 1
          }

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
          # The release builds from a clean module and build cache: a cache restored here
          # could have been saved by any job that ran on main, test jobs included, and Go
          # does not re-hash extracted module sources on restore.
          cache: false

      - name: Verify module sources
        run: go mod download && go mod verify

      # GoReleaser runs with the signing key and the write token, so its bytes are pinned here,
      # before the key is imported: a mismatch fails the job with no key material loaded. The
      # hash is not read from the release's own checksums.txt, which an attacker who can replace
      # the archive can replace too (same reasoning as TFLINT_SHA256 in security.yml). Bump
      # GORELEASER_VERSION and GORELEASER_SHA256 together, here and in goreleaser-check.yml
      # (value from the target release's checksums.txt, goreleaser_Linux_x86_64.tar.gz line).
      # Renovate only bumps the version, so its PR goes red in goreleaser-check.yml until the
      # hash is updated by hand, and goes red again if the two files' pins differ. The archive
      # goes to RUNNER_TEMP: GoReleaser refuses a dirty tree.
      - name: Install GoReleaser
        env:
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          GORELEASER_VERSION: v2.20.0
          GORELEASER_SHA256: d2483159e6007f814132cb56635ad30a70013dbeb813d6033a7e01adf6ae108c
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/goreleaser"
          mkdir -p "${install_dir}"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "${install_dir}/goreleaser.tar.gz" \
            "https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION}/goreleaser_Linux_x86_64.tar.gz"
          echo "${GORELEASER_SHA256}  ${install_dir}/goreleaser.tar.gz" | sha256sum -c -
          tar -xzf "${install_dir}/goreleaser.tar.gz" -C "${install_dir}" goreleaser
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/goreleaser" --version

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Release
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
