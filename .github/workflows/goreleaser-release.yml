name: GoReleaser Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions: {}

jobs:
  # Runs before the approval that releases the GPG key, with no secret (only the read-only job
  # token): it writes on the run's summary page the go.mod lines that changed since the last
  # release users received signed, which the approver checks before approving (RELEASE.md,
  # "Approve a release"). A maintainer merged each module update; this approval is the last human
  # check before they ship signed, with every change since the last signed release in one list.
  dependency-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the previous release tag and its go.mod
          persist-credentials: false

      # The baseline is the newest earlier tag whose GitHub release carries the signed checksums.
      # A version tagged but never signed (approval rejected, signing failed, release deleted) is
      # skipped, so its module changes are listed again here rather than shipping unseen. A failed
      # API call also counts as unsigned: it widens the comparison, never narrows it.
      - name: List the go.mod changes since the last signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(git tag --merged "${GITHUB_SHA}^" --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname)
          previous=""
          unsigned=()
          for tag in "${tags[@]:0:20}"; do
            assets=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.assets[].name' 2>/dev/null || true)
            if grep -q '_SHA256SUMS\.sig$' <<< "${assets}"; then
              previous="${tag}"
              break
            fi
            unsigned+=("${tag}")
          done
          if [ -z "${previous}" ]; then
            if [ "${#tags[@]}" -eq 0 ]; then
              echo "No previous release tag: nothing to compare." >> "${GITHUB_STEP_SUMMARY}"
            else
              echo "No release with signed binaries among the ${#unsigned[@]} most recent tags: compare \`go.mod\` by hand before approving." >> "${GITHUB_STEP_SUMMARY}"
            fi
            exit 0
          fi
          changes=$(git diff --unified=0 "${previous}" "${GITHUB_SHA}" -- go.mod | grep -E '^[-+][^-+]' || true)
          {
            echo "## go.mod changes from ${previous} to ${GITHUB_REF_NAME}"
            echo
            if [ "${#unsigned[@]}" -gt 0 ]; then
              echo "${previous} is the last release with signed binaries. Tagged but never signed, so included here: ${unsigned[*]}."
              echo
            fi
            if [ -z "${changes}" ]; then
              echo "None: this release compiles the same modules as ${previous}."
            else
              echo "\`go.mod\` lists every module compiled into the provider. Check each change before approving the signing job (RELEASE.md, \"Approve a release\")."
              echo
              echo '```diff'
              echo "${changes}"
              echo '```'
            fi
            echo
            echo "Full diff: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
          } >> "${GITHUB_STEP_SUMMARY}"

  goreleaser-release:
    needs: dependency-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The GPG key and its passphrase are secrets of this environment only, whose deployment
    # policy admits `v*` tags alone (RELEASE.md, "Protect the release credentials"); a workflow
    # pushed on any other ref cannot read them.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            uploads.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # GoReleaser needs the full git history to build the changelog and detect the previous tag
          persist-credentials: false  # GoReleaser publishes through GITHUB_TOKEN, not git

      # Defence in depth only: a tag-triggered run reads this file from the tagged commit, so the
      # tag ruleset and the environment above are what actually stop an arbitrary tag.
      - name: Check the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main; refusing to sign a release from it."
            exit 1
          }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          # The release builds from a clean module and build cache: a cache restored here
          # could have been saved by any job that ran on main, test jobs included, and Go
          # does not re-hash extracted module sources on restore.
          cache: false

      - name: Verify module sources
        run: go mod download && go mod verify

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # renovate: datasource=github-releases depName=goreleaser/goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
