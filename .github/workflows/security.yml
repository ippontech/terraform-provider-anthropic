name: Security

on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  poutine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install poutine
        run: |
          curl -sSfL https://github.com/boostsecurityio/poutine/releases/download/v1.1.3/poutine_Linux_x86_64.tar.gz \
            | tar xz -C /usr/local/bin poutine

      - name: Run poutine
        run: poutine analyze_local . --config tools/.poutine.yml --fail-on-violation

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            fail-open.prod.semgrep.dev:443
            github.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: tools/semgrep.yml

  tflint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installed from the GitHub release with checksum verification rather than
      # through a third-party action (poutine flags setup-tflint's unverified
      # creator, and a pinned binary is the smaller supply-chain surface).
      #
      # The expected hash is pinned here, not read from the release's own
      # checksums.txt: both files come from the same source, so a compromised
      # release would poison the checksum along with the binary. Bump
      # TFLINT_VERSION and TFLINT_SHA256 together (value from the target
      # release's checksums.txt, tflint_linux_amd64.zip line). Renovate only
      # bumps the version, so its PR goes red here until the hash is updated
      # by hand; renovate.json therefore excludes tflint from automerge.
      - name: Install tflint
        env:
          # renovate: datasource=github-releases depName=terraform-linters/tflint
          TFLINT_VERSION: v0.65.0
          TFLINT_SHA256: d4c545ed2e29d6338604b586f34f544f380f70f243aa72f7b484713835eaec61
        run: |
          set -euo pipefail
          base="https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}"
          curl -fsSLO "${base}/tflint_linux_amd64.zip"
          echo "${TFLINT_SHA256}  tflint_linux_amd64.zip" | sha256sum -c -
          install_dir="${RUNNER_TEMP}/tflint"
          mkdir -p "${install_dir}"
          unzip -o -q tflint_linux_amd64.zip -d "${install_dir}"
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/tflint" --version

      # .tflint.hcl enables the full terraform ruleset (preset "all"); the
      # bundled ruleset needs no `tflint --init`. Lints every module in the
      # repo (examples, tests), not just the files a commit touched (#229).
      - name: Run tflint
        run: tflint --recursive --format compact

  # semantic-release.yml runs only on a schedule and on dispatch, so nothing on a pull request
  # exercises its "Install Node.js" step. Renovate bumps NODE_VERSION alone: merged without its
  # NODE_SHA256, the pair would fail every release run. This job downloads the archive and checks
  # the pair on the pull request instead; it holds no secret.
  node-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            nodejs.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the Node.js version and digest of semantic-release.yml
        run: |
          set -euo pipefail
          file=.github/workflows/semantic-release.yml
          version=$(sed -n 's/^  NODE_VERSION: //p' "${file}")
          sha=$(sed -n 's/^  NODE_SHA256: //p' "${file}")
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${sha}" =~ ^[0-9a-f]{64}$ ]]
          archive="node-v${version}-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://nodejs.org/dist/v${version}/${archive}"
          echo "${sha}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -

  checkov:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443
            www.bridgecrew.cloud:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run checkov
        uses: bridgecrewio/checkov-action@83b08f51b20950f791f5caadcc92e336b371eb12 # v12.3143.0
        with:
          directory: .github/workflows
          framework: github_actions
          quiet: true
          compact: true
          output_format: cli

  # testacc.yml runs on pushes to main, on dispatch and from the release workflow, never on a pull
  # request, so nothing on a pull request exercises its two "Install Terraform" steps. Renovate bumps
  # TERRAFORM_VERSION alone: merged without its TERRAFORM_SHA256, the pair would fail every run on
  # main and block the release. This job checks on the pull request that both steps carry the same
  # pair, downloads the archive and checks it; it holds no secret.
  terraform-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            releases.hashicorp.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the Terraform version and digest of testacc.yml
        run: |
          set -euo pipefail
          file=.github/workflows/testacc.yml
          versions=$(sed -n 's/^ *TERRAFORM_VERSION: //p' "${file}")
          shas=$(sed -n 's/^ *TERRAFORM_SHA256: //p' "${file}")
          # Two install steps, one per job: each must carry the pair, and the same one.
          if [[ "$(wc -l <<< "${versions}")" -ne 2 || "$(wc -l <<< "${shas}")" -ne 2 ]]; then
            echo "::error file=${file}::expected TERRAFORM_VERSION and TERRAFORM_SHA256 twice each"
            exit 1
          fi
          if [[ "$(sort -u <<< "${versions}" | wc -l)" -ne 1 || "$(sort -u <<< "${shas}" | wc -l)" -ne 1 ]]; then
            echo "::error file=${file}::the two Install Terraform steps pin different versions or digests"
            exit 1
          fi
          version=$(head -n 1 <<< "${versions}")
          sha=$(head -n 1 <<< "${shas}")
          [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${sha}" =~ ^[0-9a-f]{64}$ ]]
          archive="terraform_${version#v}_linux_amd64.zip"
          curl --proto '=https' --tlsv1.2 -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://releases.hashicorp.com/terraform/${version#v}/${archive}"
          echo "${sha}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
