# `pre-commit install` installs both hook types; the existing hooks keep
# running at the pre-commit stage only, and the commit-msg hook checks the
# Conventional Commits format (CONTRIBUTING.md, Conventional Commits).
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: check-yaml
      exclude: ^\.gitlab
    - id: end-of-file-fixer
    - id: trailing-whitespace
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        # Same types as the pr-title check (.github/workflows/pr-title.yml).
        args: [feat, fix, perf, revert, docs, style, chore, refactor, test, build, ci]
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.3
    hooks:
      - id: terraform_fmt
        args:
          - --envs=OTEL_TRACES_EXPORTER=
      - id: terraform_tflint
        args:
          - --envs=OTEL_TRACES_EXPORTER=
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: poutine
        name: poutine
        language: system
        entry: mise exec -- poutine analyze_local . --config tools/.poutine.yml --fail-on-violation
        pass_filenames: false
        always_run: true
  - repo: https://github.com/semgrep/semgrep
    rev: v1.182.0
    hooks:
      - id: semgrep
        args:
          - --config=tools/semgrep.yml
          - --error
        files: ^\.github/
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.3.30
    hooks:
      - id: checkov
        pass_filenames: false
        args:
          - --directory=.github/workflows
          - --framework=github_actions
          - --quiet
          - --compact
        files: ^\.github/workflows/
