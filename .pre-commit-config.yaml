repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: check-yaml
      exclude: ^\.gitlab
    - id: end-of-file-fixer
    - id: trailing-whitespace
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.3
    hooks:
      - id: terraform_fmt
        args:
          - --envs=OTEL_TRACES_EXPORTER=
      - id: terraform_tflint
        args:
          - --envs=OTEL_TRACES_EXPORTER=
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: poutine
        name: poutine
        language: system
        entry: mise exec -- poutine analyze_local . --config tools/.poutine.yml --fail-on-violation
        pass_filenames: false
        always_run: true
  - repo: https://github.com/semgrep/semgrep
    rev: v1.182.0
    hooks:
      - id: semgrep
        args:
          - --config=tools/semgrep.yml
          - --error
        files: ^\.github/
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.3.30
    hooks:
      - id: checkov
        pass_filenames: false
        args:
          - --directory=.github/workflows
          - --framework=github_actions
          - --quiet
          - --compact
        files: ^\.github/workflows/
  # Go hooks run the versions pinned in mise.toml (Go, golangci-lint), like the
  # poutine hook above, so they match `make lint` and the CI lint job.
  - repo: local
    hooks:
      # gofmt + goimports as configured in .golangci.yml, which rewrite whole
      # files. Of the files pre-commit passes, only those that differ from the
      # merge base with origin/main (from HEAD when that ref is missing) are
      # formatted: the staged files on commit, and with `pre-commit run -a`
      # the files the branch changed, never the untouched ones.
      - id: golangci-lint-fmt
        name: golangci-lint fmt
        language: system
        entry: >-
          bash -c 'base=$(git merge-base origin/main HEAD 2>/dev/null) || base=HEAD;
          changed=$(git -c core.quotePath=false diff --name-only "$base");
          files=(); for f in "$@"; do grep -qxF -- "$f" <<<"$changed" && files+=("$f"); done;
          [ ${#files[@]} -eq 0 ] || exec mise exec -- golangci-lint fmt "${files[@]}"' --
        types: [go]
      # Lints the packages, but reports only code that differs from origin/main
      # (new-from-merge-base in .golangci.yml), as the CI lint job does.
      - id: golangci-lint
        name: golangci-lint run
        language: system
        entry: mise exec -- golangci-lint run
        types: [go]
        pass_filenames: false
        require_serial: true
      - id: go-mod-tidy
        name: go mod tidy -diff
        language: system
        entry: mise exec -- go mod tidy -diff
        files: ^go\.(mod|sum)$|\.go$
        pass_filenames: false
